# Fly.io deployment for the API.
# fly launch --no-deploy → then:
#   fly secrets set DATABASE_URL=postgres://...supabase...:5432/postgres DATABASE_SSL=true \
#     CORS_ALLOWED_ORIGINS=https://sua-loja.vercel.app PAYMENT_WEBHOOK_SECRET=$(openssl rand -hex 24)
app = "commerce-api"
primary_region = "gru"   # São Paulo

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATABASE_DRIVER = "pg"
  DATABASE_POOL_MAX = "5"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/v1/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
